app:
  name: "GraphScout"
  version: "1.0.0"
  log_level: "INFO"
  environment: "development"

# Reference only: nothing reads this file. Real settings come from environment
# variables or backend/.env (see README).
graph:
  backend: "auto"            # GRAPH_BACKEND: auto | neo4j | memory
  neo4j_uri: "neo4j+s://<instance-id>.databases.neo4j.io"   # NEO4J_URI
  neo4j_username: "neo4j"    # NEO4J_USERNAME
  neo4j_password: "${NEO4J_PASSWORD:-}"
  neo4j_database: "neo4j"    # NEO4J_DATABASE

vector_db:
  embedding_model: "local-hashed-bow"   # src/utils/embeddings.py
  embedding_dimension: 1536
  top_k: 5
  similarity_metric: "cosine"
  similarity_threshold: 0.65

llm:
  provider: "openai"
  model_name: "gpt-4o"
  temperature: 0.1
  max_tokens: 2048
  api_key: "${OPENAI_API_KEY:-}"

orchestrator:
  max_iterations: 6
  completeness_threshold: 0.85
  max_tokens_budget: 16000
  enable_cycle_detection: true
  allow_speculative_hops: true
  subgraph_max_depth: 3

benchmark:
  eval_dataset_path: "data/benchmark_questions.json"
  output_dir: "results/benchmarks"
  metrics:
    - "answer_relevance"
    - "context_recall"
    - "token_efficiency"
    - "latency_seconds"
    - "hop_count"
